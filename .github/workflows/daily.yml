name: 娜娜技术雷达日报

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = 北京时间 07:00
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write           # 允许 workflow 提交日报回仓库

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 注意：本项目纯 Python 标准库，零第三方依赖，无需 pip install
      - name: 运行娜娜技术雷达
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_SITE_NAME: ${{ vars.RADAR_SITE_NAME || '娜娜技术雷达' }}
          RADAR_SITE_BY: ${{ vars.RADAR_SITE_BY || '娜娜 · 嘉儿的家情报局' }}
          RADAR_EDITOR: ${{ vars.RADAR_EDITOR || '娜娜' }}
        run: python -m radar run --if-missing
      - name: 提交日报
        run: |
          git config user.name "娜娜技术雷达"
          git config user.email "nana-radar@qihui.com"
          git add -A
          git diff --staged --quiet || git commit -m "📡 娜娜技术雷达日报 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push