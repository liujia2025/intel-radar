name: 娜娜技术雷达日报

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = 北京时间 07:00
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write           # 允许 workflow 提交日报回仓库

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 注意：本项目纯 Python 标准库，零第三方依赖，无需 pip install
      - name: 运行娜娜技术雷达（采集）
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar run --if-missing
      - name: 生成纯数据日报
        run: python -m radar.daily_report
      - name: 提交日报
        run: |
          git config user.name "娜娜技术雷达"
          git config user.email "nana-radar@qihui.com"
          # 先拉取远程最新，避免 push 冲突
          git fetch origin main
          # 暂存雷达产出
          git add -A
          # 有变更才 commit 并 push
          if ! git diff --staged --quiet; then
            git commit -m "📡 娜娜技术雷达日报 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git rebase origin/main || (git rebase --abort && git merge origin/main)
            git push
          fi